<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>PDF Lighter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    header {
      background: #181825;
      padding: 10px 14px;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #cdd6f4;
      letter-spacing: 0.05em;
      flex: 1;
    }
    .logo { font-size: 18px; }

    /* 設定按鈕 */
    #settings-btn {
      background: none;
      border: 1px solid #45475a;
      color: #a6adc8;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #settings-btn:hover { background: #313244; color: #cdd6f4; }

    /* URL 白名單狀態橫幅 */
    #url-status {
      margin: 10px 12px 0;
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    #url-status.ok {
      background: rgba(166,227,161,0.12);
      border: 1px solid rgba(166,227,161,0.3);
      color: #a6e3a1;
    }
    #url-status.warn {
      background: rgba(250,179,135,0.12);
      border: 1px solid rgba(250,179,135,0.3);
      color: #fab387;
    }
    #url-status:hover { opacity: 0.8; }

    section { padding: 10px 12px; }

    label {
      display: block;
      font-size: 11px;
      color: #a6adc8;
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Consolas', monospace;
      margin-bottom: 7px;
    }
    input[type="text"]:focus { outline: none; border-color: #89b4fa; }
    input[type="text"]::placeholder { color: #585b70; }

    .row {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }
    .row label { margin: 0; }

    .color-presets { display: flex; gap: 4px; align-items: center; }
    .color-preset {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.1s;
      position: relative;
    }
    .color-preset:hover { transform: scale(1.2); }
    .color-preset.active { border-color: #cdd6f4; box-shadow: 0 0 0 1px #181825; }
    .color-custom-btn {
      background: conic-gradient(#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000) !important;
      border-color: #45475a;
    }
    .color-hidden { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

    .small-input {
      width: 52px !important;
      margin-bottom: 0 !important;
    }

    button.primary {
      flex: 1;
      background: #a6e3a1;
      border: none;
      color: #1e1e2e;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }
    button.primary:hover { background: #94e2a8; }

    .error {
      color: #f38ba8;
      font-size: 11px;
      min-height: 14px;
      margin-bottom: 3px;
    }

    .divider { height: 1px; background: #313244; margin: 2px 0 10px; }

    #pattern-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
    }

    .empty-hint { color: #585b70; font-size: 12px; padding: 3px 0; }

    .pattern-item {
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 5px;
      padding: 6px 9px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .pattern-item.disabled { opacity: 0.45; }

    .swatch {
      width: 11px; height: 11px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    .pat-text {
      flex: 1;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pat-flags { font-size: 10px; color: #6c7086; }

    .pat-toggle, .pat-del {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 3px;
      border-radius: 3px;
      line-height: 1;
      color: #cdd6f4;
    }
    .pat-toggle:hover { background: #45475a; }
    .pat-del { color: #f38ba8; }
    .pat-del:hover { background: rgba(243,139,168,0.2); }

    footer {
      padding: 7px 12px;
      border-top: 1px solid #313244;
      background: #181825;
      font-size: 11px;
      color: #6c7086;
      display: flex;
      justify-content: space-between;
    }
    footer span { color: #a6adc8; }
  </style>
</head>
<body>
  <header>
    <span class="logo">&#128294;</span>
    <h1>PDF Lighter</h1>
    <button id="settings-btn" title="開啟設定頁">&#9881; 設定</button>
  </header>

  <!-- URL 白名單狀態 -->
  <div id="url-status" class="warn" title="點此開啟設定頁">
    <span id="url-status-icon">&#9888;</span>
    <span id="url-status-text">尚未設定 URL 白名單，點此前往設定</span>
  </div>

  <section>
    <label>螢光標記 Regex Pattern</label>
    <input id="pat" type="text" placeholder="例如：\d{4}-\d{2}-\d{2}" spellcheck="false">

    <div class="row">
      <label>Flags</label>
      <input id="flags" type="text" class="small-input" value="gi" placeholder="gi">
      <div class="color-presets" id="color-presets">
        <button class="color-preset active" data-color="#ffff00" style="background:#ffff00" title="黃"></button>
        <button class="color-preset" data-color="#b3ff6e" style="background:#b3ff6e" title="綠"></button>
        <button class="color-preset" data-color="#6effff" style="background:#6effff" title="青"></button>
        <button class="color-preset" data-color="#ff6eb4" style="background:#ff6eb4" title="粉"></button>
        <button class="color-preset" data-color="#ffaa00" style="background:#ffaa00" title="橙"></button>
        <button class="color-preset color-custom-btn" id="color-custom-btn" title="自訂顏色…"></button>
        <input type="color" id="color-custom-input" class="color-hidden" value="#ffff00">
      </div>
      <button class="primary" id="add-btn">+ 新增</button>
    </div>

    <div class="error" id="err"></div>
    <div class="divider"></div>

    <div id="pattern-list">
      <div class="empty-hint">尚未新增任何 pattern</div>
    </div>
  </section>

  <footer>
    <span id="count">0 個 highlight pattern</span>
    <span>開啟符合網址的 PDF 自動套用</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
