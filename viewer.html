<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Regex Highlighter</title>
  <link rel="stylesheet" href="styles.css">
  <!-- PDF.js 本地版本 -->
  <script src="lib/pdf.min.js"></script>
  <style>
    /* ── 版面 ─────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #404040;
      font-family: 'Segoe UI', sans-serif;
      color: #f0f0f0;
    }

    /* 頂部工具列 */
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: #1e1e2e;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #toolbar button {
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    #toolbar button:hover { background: #45475a; }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }

    #page-info {
      font-size: 13px;
      color: #a6adc8;
      min-width: 90px;
      text-align: center;
    }

    #zoom-display {
      font-size: 13px;
      color: #a6adc8;
      min-width: 50px;
      text-align: center;
    }

    #filename {
      flex: 1;
      font-size: 12px;
      color: #6c7086;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Regex 面板 toggle 按鈕 */
    #toggle-panel-btn {
      background: #89b4fa !important;
      color: #1e1e2e !important;
      font-weight: 600;
    }
    #toggle-panel-btn:hover { background: #74c7ec !important; }

    /* ── 側邊面板 ──────────────────────────────────────── */
    #panel {
      position: fixed;
      top: 48px; right: 0;
      width: 320px;
      height: calc(100% - 48px);
      background: #1e1e2e;
      border-left: 1px solid #313244;
      display: flex;
      flex-direction: column;
      z-index: 900;
      transition: transform 0.25s ease;
    }
    #panel.hidden { transform: translateX(320px); }

    #panel-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      background: #181825;
      border-bottom: 1px solid #313244;
      color: #cdd6f4;
    }

    #pattern-form {
      padding: 12px;
      border-bottom: 1px solid #313244;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #pattern-input {
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Consolas', monospace;
      width: 100%;
    }
    #pattern-input:focus { outline: none; border-color: #89b4fa; }
    #pattern-input::placeholder { color: #585b70; }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #flags-input {
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Consolas', monospace;
      width: 60px;
    }
    #flags-input:focus { outline: none; border-color: #89b4fa; }

    /* 螢光色預設按鈕 */
    .color-presets {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .color-preset {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, border-color 0.1s;
      flex-shrink: 0;
      position: relative;
    }
    .color-preset:hover { transform: scale(1.15); }
    .color-preset.active {
      border-color: #cdd6f4;
      box-shadow: 0 0 0 1px #181825;
    }
    /* 自訂色按鈕：彩虹漸層，視覺上區分於預設色 */
    .color-custom-btn {
      background: conic-gradient(
        #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000
      ) !important;
      border-color: #45475a;
    }
    .color-custom-btn.picked { /* 已選取自訂色後，改顯示該色 */ }
    /* 隱藏的 color input */
    .color-hidden { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

    #add-pattern-btn {
      flex: 1;
      background: #a6e3a1;
      border: none;
      color: #1e1e2e;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    #add-pattern-btn:hover { background: #94e2a8; }

    #pattern-error {
      font-size: 11px;
      color: #f38ba8;
      min-height: 16px;
    }

    #pattern-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pattern-item {
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pattern-item.disabled { opacity: 0.5; }

    .pattern-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .pattern-text {
      flex: 1;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: #cdd6f4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pattern-flags {
      font-size: 10px;
      color: #6c7086;
    }

    .pattern-toggle, .pattern-delete {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
    }
    .pattern-toggle:hover { background: #45475a; }
    .pattern-delete { color: #f38ba8; }
    .pattern-delete:hover { background: rgba(243,139,168,0.2); }

    #match-count {
      padding: 8px 12px;
      font-size: 12px;
      color: #6c7086;
      border-top: 1px solid #313244;
      background: #181825;
    }

    /* ── PDF 容器 ──────────────────────────────────────── */
    #pdf-container {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: right 0.25s ease;
    }
    #pdf-container.panel-open { right: 320px; }

    /* ── 每頁包裝 ─────────────────────────────────────── */
    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      background: white;
    }

    .page-wrapper canvas {
      display: block;
    }

    /* text layer (PDF.js 標準) */
    .textLayer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
      line-height: 1;
    }

    .textLayer span,
    .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      pointer-events: all;
    }

    /* ── Highlight mark ──────────────────────────────── */
    .pdf-highlight {
      position: absolute;
      pointer-events: none;
      border-radius: 2px;
      mix-blend-mode: multiply;
      opacity: 0.6;
    }

    /* ── 載入指示 ─────────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #1e1e2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 2000;
    }
    #loading-overlay.hidden { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #313244;
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: #a6adc8; font-size: 14px; }

    #error-msg {
      position: fixed;
      top: 60px; left: 50%;
      transform: translateX(-50%);
      background: #f38ba8;
      color: #1e1e2e;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1500;
      display: none;
    }
  </style>
</head>
<body>

<!-- 載入遮罩 -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">載入 PDF 中…</div>
</div>

<!-- 錯誤訊息 -->
<div id="error-msg"></div>

<!-- 頂部工具列 -->
<div id="toolbar">
  <button id="prev-btn" title="上一頁">&#9664;</button>
  <span id="page-info">0 / 0</span>
  <button id="next-btn" title="下一頁">&#9654;</button>
  <button id="zoom-out-btn" title="縮小">&#8722;</button>
  <span id="zoom-display">100%</span>
  <button id="zoom-in-btn" title="放大">&#43;</button>
  <button id="zoom-fit-width-btn" title="符合寬度（扣除右側面板）">符合寬度</button>
  <button id="zoom-fit-height-btn" title="符合高度（扣除工具列）">符合高度</button>
  <span id="filename"></span>
  <button id="toggle-panel-btn" title="Regex 面板">&#128269; Regex</button>
</div>

<!-- Regex 側邊面板 -->
<div id="panel">
  <div id="panel-header">Regex 螢光標記</div>
  <div id="pattern-form">
    <input id="pattern-input" type="text" placeholder="輸入 regex，例如 \d{4}-\d{2}-\d{2}" spellcheck="false">
    <div class="form-row">
      <input id="flags-input" type="text" value="gi" placeholder="flags" title="Regex flags，例如 gi、m">
      <div class="color-presets" id="color-presets">
        <button class="color-preset active" data-color="#ffff00" style="background:#ffff00" title="黃"></button>
        <button class="color-preset" data-color="#b3ff6e" style="background:#b3ff6e" title="綠"></button>
        <button class="color-preset" data-color="#6effff" style="background:#6effff" title="青"></button>
        <button class="color-preset" data-color="#ff6eb4" style="background:#ff6eb4" title="粉"></button>
        <button class="color-preset" data-color="#ffaa00" style="background:#ffaa00" title="橙"></button>
        <button class="color-preset color-custom-btn" id="color-custom-btn" title="自訂顏色…"></button>
        <input type="color" id="color-custom-input" class="color-hidden" value="#ffff00">
      </div>
      <button id="add-pattern-btn">+ 新增</button>
    </div>
    <div id="pattern-error"></div>
  </div>
  <div id="pattern-list"></div>
  <div id="match-count">共找到 0 個符合項目</div>
</div>

<!-- PDF 頁面容器（panel 預設開啟，對應 state.panelOpen = true） -->
<div id="pdf-container" class="panel-open"></div>

<script src="viewer.js"></script>
</body>
</html>
