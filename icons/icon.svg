<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#1e1e2e"/>
  <!-- PDF document shape -->
  <rect x="24" y="16" width="64" height="82" rx="6" fill="#313244"/>
  <rect x="24" y="16" width="64" height="82" rx="6" fill="none" stroke="#89b4fa" stroke-width="3"/>
  <!-- Folded corner -->
  <path d="M72 16 L88 32 L72 32 Z" fill="#45475a"/>
  <!-- Text lines -->
  <rect x="34" y="46" width="44" height="5" rx="2.5" fill="#585b70"/>
  <rect x="34" y="58" width="36" height="5" rx="2.5" fill="#585b70"/>
  <rect x="34" y="70" width="40" height="5" rx="2.5" fill="#585b70"/>
  <!-- Highlight bar (yellow) -->
  <rect x="34" y="55" width="44" height="11" rx="3" fill="#ffff00" opacity="0.55"/>
  <!-- Search magnifier -->
  <circle cx="90" cy="95" r="22" fill="#181825"/>
  <circle cx="90" cy="95" r="14" fill="none" stroke="#a6e3a1" stroke-width="5"/>
  <line x1="100" y1="105" x2="112" y2="117" stroke="#a6e3a1" stroke-width="5" stroke-linecap="round"/>
  <!-- Regex slash inside magnifier -->
  <text x="84" y="100" font-family="Consolas,monospace" font-size="14" fill="#cdd6f4">.*</text>
</svg>
